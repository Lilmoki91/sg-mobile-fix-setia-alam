<!-- AI chatbot: ruang penuh di antara navigasi atas dan bawah -->
<button id="chatbot-toggle" type="button" aria-label="Buka AI chatbot" aria-controls="chatbot-window" aria-expanded="false">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12 2l2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2z"/>
    <path d="M20 1l.8 2.2L23 4l-2.2.8L20 7l-.8-2.2L17 4l2.2-.8z"/>
  </svg>
</button>

<section id="chatbot-window" role="region" aria-labelledby="chatbot-title" aria-hidden="true" inert>
  <header class="chatbot-header">
    <div class="chatbot-avatar" aria-hidden="true">✦<span></span></div>
    <div class="chatbot-heading">
      <span class="chatbot-badge" data-i18n-key="ChatbotBadge">ELIZA Ai</span>
      <h2 id="chatbot-title" data-i18n-key="ChatbotTitle">AI Pembantu Servis</h2>
      <p data-i18n-key="ChatbotSubtitle">✨ 24/7 Bantuan Pintar</p>
    </div>
    <button id="chatbot-close" type="button" aria-label="Tutup AI chatbot" title="Tutup / Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </header>

  <div id="chatbot-messages" class="chat-container" role="log" aria-live="polite" aria-relevant="additions" aria-label="Mesej chatbot">
    <div class="chatbot-message chatbot-message--assistant">
      <div class="chatbot-bubble">
        <p data-i18n-key="ChatbotGreeting">✨ Helo! Saya Eliza Ai Pembantu Servis 24/7 Sg Mobile Fix. Ada apa-apa yang saya boleh bantu?</p>
      </div>
    </div>
  </div>

  <div class="chatbot-composer">
    <button id="chatbot-reset" type="button" aria-label="Reset mesej" title="Reset mesej">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14M10 10v7M14 10v7"/>
      </svg>
    </button>
    <textarea id="chatbot-input" rows="1" aria-label="Soalan untuk AI chatbot" data-i18n-placeholder="ChatbotPlaceholder" placeholder="Taip soalan anda..." autocomplete="off" enterkeyhint="enter"></textarea>
    <button id="chatbot-send" type="button" aria-label="Hantar mesej" title="Hantar / Send">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/>
      </svg>
    </button>
  </div>
</section>
