<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Tempahan - SG Mobile Fix Setia Alam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- 📌 css acsess 📌 -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
    .admin-card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .btn-action { transition: all 0.2s; }
    .btn-action:active { transform: scale(0.95); }
    .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-sm mb-4">
      <a href="index.html?menu=open" class="inline-flex items-center text-sm font-semibold text-gray-600 hover:text-blue-600 transition">
        <i class="fas fa-arrow-left mr-2"></i> Kembali
      </a>
    </div>
    <div class="admin-card w-full max-w-sm p-8">
      <div class="text-center mb-6">
        <img src="https://raw.githubusercontent.com/Lilmoki91/sg-mobile-fix-setia-alam/refs/heads/main/assets/logo/logo-sg-mobile.webp"
             alt="SG Mobile Fix" class="h-20 mx-auto mb-4 object-contain">
        <h1 class="text-xl font-bold text-gray-800">Panel Admin Tempahan</h1>
        <p class="text-sm text-gray-500 mt-1">SG Mobile Fix Setia Alam</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Kata Laluan</label>
          <input type="password" id="admin-password" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 placeholder="Masukkan kata laluan">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
          Log Masuk
        </button>
        <p id="login-error" class="text-red-500 text-sm text-center hidden">Kata laluan salah.</p>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard" class="hidden">
    <!-- Header -->
    <nav class="sticky top-0 z-50 bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-lg">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <img src="https://raw.githubusercontent.com/Lilmoki91/sg-mobile-fix-setia-alam/refs/heads/main/assets/logo/logo-sg-mobile.webp"
               alt="Logo" class="h-10 w-auto object-contain bg-white rounded-full p-1">
          <div>
            <h1 class="font-bold text-lg">Admin Panel</h1>
            <p class="text-xs text-blue-200">SG Mobile Fix Setia Alam</p>
          </div>
        </div>
        <button id="logout-btn" class="text-sm bg-white/20 hover:bg-white/30 px-4 py-2 rounded-full transition">
          <i class="fas fa-sign-out-alt mr-1"></i> Log Keluar
        </button>
      </div>
    </nav>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="admin-card p-4 text-center">
          <p class="text-2xl font-bold text-blue-600" id="stat-total">0</p>
          <p class="text-xs text-gray-500">Jumlah</p>
        </div>
        <div class="admin-card p-4 text-center">
          <p class="text-2xl font-bold text-amber-500" id="stat-pending">0</p>
          <p class="text-xs text-gray-500">Menunggu</p>
        </div>
        <div class="admin-card p-4 text-center">
          <p class="text-2xl font-bold text-green-600" id="stat-confirmed">0</p>
          <p class="text-xs text-gray-500">Disahkan</p>
        </div>
        <div class="admin-card p-4 text-center">
          <p class="text-2xl font-bold text-red-600" id="stat-rejected">0</p>
          <p class="text-xs text-gray-500">Ditolak</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="admin-card p-4 mb-6">
        <div class="flex flex-wrap gap-2 justify-center">
          <button class="filter-admin-btn px-4 py-2 rounded-full text-sm font-bold bg-blue-600 text-white" data-filter="all">
            Semua
          </button>
          <button class="filter-admin-btn px-4 py-2 rounded-full text-sm font-bold bg-gray-200 text-gray-700" data-filter="pending">
            Menunggu
          </button>
          <button class="filter-admin-btn px-4 py-2 rounded-full text-sm font-bold bg-gray-200 text-gray-700" data-filter="confirmed">
            Disahkan
          </button>
          <button class="filter-admin-btn px-4 py-2 rounded-full text-sm font-bold bg-gray-200 text-gray-700" data-filter="rejected">
            Ditolak
          </button>
        </div>
      </div>

      <!-- Import / Export -->
      <div class="admin-card p-4 mb-6">
        <div class="flex flex-wrap gap-2 justify-center">
          <button id="export-json-btn" class="px-4 py-2 rounded-full text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition">
            <i class="fas fa-download mr-1"></i> Eksport JSON
          </button>
          <button id="import-json-btn" class="px-4 py-2 rounded-full text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition">
            <i class="fas fa-upload mr-1"></i> Import JSON
          </button>
          <input type="file" id="import-json-file" accept="application/json" class="hidden">
        </div>
        <p class="text-xs text-gray-500 text-center mt-2">
          Import/Eksport boleh digunakan untuk backup atau sync antara peranti admin dan pelanggan.
        </p>
      </div>

      <!-- Booking List -->
      <div id="admin-booking-list" class="space-y-4">
        <!-- Cards generated by JS -->
      </div>

      <!-- Empty state -->
      <div id="admin-empty" class="hidden text-center py-12">
        <i class="fas fa-calendar-times text-4xl text-gray-300 mb-3"></i>
        <p class="text-gray-500">Tiada tempahan untuk ditunjukkan.</p>
      </div>
    </main>
  </div>

  <!-- 📌 java script acsess 📌 -->
  <script src="js/script.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/booking-firebase.js" defer></script>
  <script src="js/booking-ui.js" defer></script>
  <script src="js/admin-dashboard.js" defer></script>
</body>
</html>
