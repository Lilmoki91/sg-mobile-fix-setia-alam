name: Deploy Eliza AI to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'backend-ai-chatbot/**' # Hanya jalan kalau folder ni berubah

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-ai-chatbot # Fokus dalam folder backend je

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend-ai-chatbot/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ELIZA_TOKEN_API }}
          accountId: ${{ secrets.CLOUDFLARE_ELIZA_ACCOUNT_ID }}
          workingDirectory: 'backend-ai-chatbot'
          command: deploy
