name: Deploy Eliza AI

on:
  push:
    branches:
      - main
    paths:
      - 'backend-ai-chatbot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install
        working-directory: './backend-ai-chatbot'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ELIZA_TOKEN_API }}
          accountId: ${{ secrets.CLOUDFLARE_ELIZA_ACCOUNT_ID }}
          workingDirectory: 'backend-ai-chatbot'
          command: deploy
