name: Deploy Eliza AI

on:
  push:
    branches: [main]
    paths:
      - 'backend-ai-chatbot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend-ai-chatbot
        run: npm install

      - name: Deploy Worker
        working-directory: backend-ai-chatbot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ELIZA_TOKEN_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ELIZA_ACCOUNT_ID }}
        run: npx wrangler deploy src/index.js --name eliza-ai-backend
