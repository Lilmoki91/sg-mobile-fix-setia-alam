name: Deploy Backend Admin Panel

on:
  push:
    branches: [main]
    paths:
      - 'backend-admin-panel/**' # Hanya jalan jika fail dalam folder ni berubah
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-admin-panel # <--- PENTING: Arahkan ke folder worker
