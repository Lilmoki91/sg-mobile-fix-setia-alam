name: Deploy Backend Admin Panel

on:
  push:
    branches: [main]
    paths:
      - 'backend-admin-panel/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend-admin-panel
        run: npm install

      - name: Deploy Worker
        working-directory: backend-admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Arahan ini paksa Wrangler guna fail spesifik ni
        run: npx wrangler deploy src/index.js --name sgmfix-admin --compatibility-date 2026-10-19
