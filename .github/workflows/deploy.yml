name: Deploy Backend Admin Panel

on:
  push:
    branches: [main]
    paths:
      - 'backend-admin-panel/**' # Hanya deploy jika fail dalam folder ni berubah
  workflow_dispatch: # Membolehkan anda klik "Run workflow" secara manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-admin-panel # Arahkan ke folder backend
